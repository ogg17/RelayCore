services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: relaycore
      POSTGRES_PASSWORD: relaycore_dev
      POSTGRES_DB: relaycore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "relaycore", "-d", "relaycore"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:
